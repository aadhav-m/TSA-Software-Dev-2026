<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignFlow</title>
    <link rel="stylesheet" href="/CSS/styles-sign.css">
    <link rel="stylesheet" href="/CSS/styles-textToSign.css">
    <script src="/JS/speech.js" defer></script>
</head>
<body>
    <header>
        <h1>
            <a href="/HTML/index.html" style="text-decoration: none;">SignFlow</a>
        </h1>
        <div class="navbar_toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="navbar_menu">
            <li class="navbar_item">
                <a href="/HTML/index.html" style="text-decoration: none;" class="navbar_links">Home</a>
            </li>
            <li class="navbar_item">
                <a href="/HTML/SpeechToText.html" style="text-decoration: none;" class="navbar_links">Speech-To-Text</a>
            </li>
            <li class="navbar_item">
                <a href="/HTML/SignToText.html" style="text-decoration: none;" class="navbar_links">Sign-To-Text</a>
            </li>
            <li class="navbar_item">
                <a href="/HTML/Conversation.html" style="text-decoration: none;" class="navbar_links">Conversation</a>
            </li>
        </ul>
    </header>

    <main class="t2s-page minimal">
        <div class="page-head">
            <h2>Text To Sign Language</h2>
        </div>

        <div class="t2s-grid">
            <section class="panel input-panel">
                <textarea id="t2s-source" placeholder="Type a word or sentence…">HELLO</textarea>
                <div class="t2s-speed-row">
                    <label for="t2s-speed">Speed</label>
                    <input type="range" id="t2s-speed" min="0.25" max="1" step="0.05" value="1">
                    <span class="t2s-speed-value" id="t2s-speed-value">1×</span>
                </div>
                <button class="button-neon primary" id="t2s-play"><span>✋ Sign It</span></button>
            </section>

            <section class="panel output-panel">
                <canvas id="t2s-canvas" class="t2s-canvas"></canvas>
            </section>
        </div>
    </main>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
    </script>

    <script type="module" src="/JS/textToSign/signRenderer.js"></script>
</body>
</html>
