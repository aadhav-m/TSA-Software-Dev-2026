<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignFlow</title>
    <link rel="stylesheet" href="/CSS/styles-speech.css">
    <script src="https://js.puter.com/v2/"></script>
    <script src="/JS/speech.js" defer></script>
</head>
<body>
    <header>
        <h1>
            <a href="/HTML/index.html" style="text-decoration: none;">SignFlow</a>
        </h1>
        <div class="navbar_toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="navbar_menu">
            <li class="navbar_item">
                <a href="/HTML/index.html" style="text-decoration: none;" class="navbar_links">Home</a>
            </li>
            <li class="navbar_item">
                <a href="/HTML/SignToText.html" style="text-decoration: none;" class="navbar_links">Sign-To-Text</a>
            </li>
        </ul>
    </header>

    <div class="center-wrapper">
        <h2>Speech-To-Text</h2>
        <div class="controls">
            <button class="button-neon" id="startBtn"><span>Start Recording</span></button>
            <button class="button-neon" id="stopBtn" style="display:none;"><span>Stop Recording</span></button>
        </div>
        <input type="file" id="audio-upload" accept="audio/*">
        <ul id="recordingsList"></ul>
        <button class="button-neon" id="transcribe-btn" style="margin-top: -50px;"><span>Transcribe Audio</span></button>
        <div id="transcript-output"></div>

        <h2>Text-To-Speech</h2>
        <textarea id="tts-input" placeholder="Type here..."></textarea>
        <input type="file" id="text-upload" accept="text/plain, .txt">
        <button class="button-neon" id="audio-btn"><span>▶ Play Audio</span></button>
    </div>

    <script>
        let rec, blob, chunks = [];

        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });
                rec = new MediaRecorder(stream);
                chunks = [];
                rec.ondataavailable = e => chunks.push(e.data);
                rec.onstop = () => {
                    blob = new Blob(chunks, { type: 'audio/webm' });
                };
                rec.start();
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'inline-flex';
            }
            catch (err) {
                alert('Microphone access denied: ' + err.message);
            }
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            rec.stop();
            document.getElementById('startBtn').style.display = 'inline-flex';
            document.getElementById('stopBtn').style.display = 'none';
        });

        document.getElementById('transcribe-btn').addEventListener('click', async () => {
            if (!(await puter.auth.isSignedIn())){
                await puter.auth.signIn();
            }

            const fileInput = document.getElementById('audio-upload');
            const outputDiv = document.getElementById('transcript-output');

            let audioSource = fileInput.files[0] ? fileInput.files[0] : blob;

            if (!audioSource) {
                outputDiv.classList.remove('loading', 'error');
                outputDiv.textContent = 'Please record audio or select an audio file first.';
                return;
            }

            outputDiv.classList.remove('error');
            outputDiv.classList.add('loading');
            outputDiv.textContent = 'Transcribing...';

            try {
                const result = await puter.ai.speech2txt(audioSource);
                outputDiv.classList.remove('loading');
                const text = typeof result?.text === 'string' ? result.text : typeof result === 'string' ? result : '';
                outputDiv.textContent = text.trim() !== '' ? text : 'No speech detected.';
            } catch (error) {
                outputDiv.classList.remove('loading');
                outputDiv.classList.add('error');
                outputDiv.textContent = 'Error: ' + error.message;
            }
        });

        const audioBtn = document.getElementById('audio-btn');
        const textUpload = document.getElementById('text-upload');
        let currentAudio = null;

        textUpload.addEventListener('change', async () => {
            if (textUpload.files[0]) {
                const text = await textUpload.files[0].text();
                document.getElementById('tts-input').value = text;
                textUpload.value = '';
            }
        });

        audioBtn.addEventListener('click', async () => {
            if (!(await puter.auth.isSignedIn())){
                await puter.auth.signIn();
            }
            
            let text = document.getElementById('tts-input').value.trim();

            if (!text) {
                const span = audioBtn.querySelector('span');
                span.textContent = 'Type your message!';
                setTimeout(() => { span.textContent = '▶ Play Audio'; }, 1200);
                return;
            }

            if (audioBtn.disabled) return;

            const span = audioBtn.querySelector('span');
            audioBtn.disabled = true;
            span.textContent = 'Speaking...';

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            try {
                const audio = await puter.ai.txt2speech(text, {
                    voice: 'Joanna',
                    engine: 'generative',
                    language: 'en-US'
                });
                currentAudio = audio;
                audio.play();
                audio.onended = () => {
                    currentAudio = null;
                    audioBtn.disabled = false;
                    span.textContent = '▶ Play Audio';
                };
            } catch (err) {
                audioBtn.disabled = false;
                span.textContent = '▶ Play Audio';
                alert('TTS error: ' + err.message);
            }
        });
    </script>
</body>
</html>
