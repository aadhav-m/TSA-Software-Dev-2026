<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignFlow — Text to Speech</title>
    <link rel="stylesheet" href="/CSS/styles-sign.css">
    <link rel="stylesheet" href="/CSS/styles-textToSign.css">
    <script src="https://js.puter.com/v2/"></script>
    <script src="/JS/speech.js" defer></script>
</head>
<body>
    <header>
        <h1>
            <a href="/HTML/index.html" style="text-decoration: none;">SignFlow</a>
        </h1>
        <div class="navbar_toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="navbar_menu">
            <li class="navbar_item">
                <a href="/HTML/index.html" style="text-decoration: none;" class="navbar_links">Home</a>
            </li>
            <li class="navbar_item">
                <a href="/HTML/SignToText.html" style="text-decoration: none;" class="navbar_links">Sign → Text</a>
            </li>
            <li class="navbar_item">
                <a href="/HTML/TextToSign.html" style="text-decoration: none;" class="navbar_links">Text → Sign</a>
            </li>
            <li class="navbar_item">
                <a href="/HTML/Conversation.html" style="text-decoration: none;" class="navbar_links">Conversation</a>
            </li>
        </ul>
    </header>

    <main class="t2s-page">
        <div class="page-head">
            <h2>Text → Speech</h2>
        </div>

        <section class="panel" style="max-width: 560px; margin: 0 auto;">
            <textarea id="tts-input" placeholder="Type a word or sentence…"></textarea>
            <button class="button-neon primary" id="audio-btn"><span>▶ Play Audio</span></button>
        </section>
    </main>

    <script>
        const audioBtn = document.getElementById('audio-btn');
        const ttsInput = document.getElementById('tts-input');
        let currentAudio = null;

        audioBtn.addEventListener('click', async () => {
            const span = audioBtn.querySelector('span');
            const text = ttsInput.value.trim();

            if (!text) {
                span.textContent = 'Type your message!';
                setTimeout(() => { span.textContent = '▶ Play Audio'; }, 1200);
                return;
            }
            if (audioBtn.disabled) return;

            if (!(await puter.auth.isSignedIn())) {
                await puter.auth.signIn();
            }

            audioBtn.disabled = true;
            span.textContent = 'Speaking…';

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            try {
                const audio = await puter.ai.txt2speech(text, {
                    voice: 'Joanna',
                    engine: 'generative',
                    language: 'en-US',
                });
                currentAudio = audio;
                audio.play();
                audio.onended = () => {
                    currentAudio = null;
                    audioBtn.disabled = false;
                    span.textContent = '▶ Play Audio';
                };
            } catch (err) {
                audioBtn.disabled = false;
                span.textContent = '▶ Play Audio';
                alert('TTS error: ' + err.message);
            }
        });
    </script>
</body>
</html>
